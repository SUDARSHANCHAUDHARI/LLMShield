name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # No id-token: write on purpose. Granting it makes @semantic-release/npm attempt npm
      # trusted publishing before it falls back to NPM_TOKEN, and that exchange cannot succeed
      # here: trusted publishing has to be configured against a package that already exists.
      # Measured on run 46173789290: "OIDC token exchange with the npm registry failed: 404
      # OIDC token exchange error - package not found". Add it back when trusted publishing is
      # actually set up on npmjs.com, and drop NPM_TOKEN in the same change.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          # No registry-url. It makes setup-node write an .npmrc holding
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and point npm's userconfig at
          # it. This job sets NPM_TOKEN, not NODE_AUTH_TOKEN, so that expands to an empty
          # string and every registry call goes out unauthenticated — a valid token still
          # fails with E401. semantic-release writes its own .npmrc from NPM_TOKEN and needs
          # no registry configured here.
      - run: pnpm install --frozen-lockfile
      # `files` publishes dist/, so it has to be built from this exact commit before the
      # publish step runs. Without this the tarball would be empty.
      - run: pnpm build
      - run: npx --yes semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
